<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Somar Notas</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#000000;
    --panel:#111111;
    --line:#2b2b2b;
    --ink:#ffffff;
    --muted:#9a9a9a;
    --num:#ffffff;
    --accent:#e0a458;
    --wa:#25d366;
    --danger:#ff6b6b;
    --neg:#ff6b6b;
    --total-bg:#1a1a1a;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-shrink:0;
  }
  header .back{
    background:none;border:none;color:var(--ink);font-size:24px;
    padding:0;width:32px;height:32px;cursor:pointer;display:none;
    align-items:center;justify-content:center;
  }
  header h1{font-size:17px;font-weight:600;margin:0;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;}
  header h1.visible{display:block;}
  header .brand{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  
  .icon-btn{
    background:none;border:none;color:var(--ink);font-size:20px;
    width:38px;height:38px;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:var(--line);}
  
  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .hidden{display:none !important;}

  #listView{padding:8px 0 90px;}
  .note-card{
    display:flex;align-items:center;gap:12px;
    padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .note-card:active{background:var(--panel);}
  .note-card .info{flex:1;min-width:0;}
  .note-card .title{font-size:16px;font-weight:600;margin-bottom:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .note-card .sub{font-size:13px;color:var(--muted);}
  .note-card .tot{font-size:18px;font-weight:700;color:var(--num);white-space:nowrap;}
  .note-card .tot.neg{color:var(--neg);}
  
  .empty{text-align:center;color:var(--muted);padding:70px 30px;}
  .empty .big{font-size:40px;margin-bottom:14px;opacity:.4;}
  .empty p{font-size:15px;line-height:1.5;margin:6px 0;}

  .fab{
    position:fixed;right:18px;bottom:22px;width:58px;height:58px;
    border-radius:18px;background:var(--accent);color:#000;
    border:none;font-size:30px;font-weight:400;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.6);display:flex;
    align-items:center;justify-content:center;z-index:20;
  }
  .fab:active{transform:scale(.94);}

  #editView{display:flex;flex-direction:column;}
  #noteTitle{
    background:var(--panel);border:none;border-bottom:1px solid var(--line);
    color:var(--ink);font-size:18px;font-weight:600;padding:14px 18px;
    width:100%;outline:none;flex-shrink:0;font-family:var(--font);
  }
  #noteTitle::placeholder{color:var(--muted);font-weight:400;}
  
  .editor-wrap{flex:1;display:flex;overflow:hidden;position:relative;}
  
  .gutter{
    flex-shrink:0;padding:16px 0;text-align:right;color:var(--muted);
    font-size:15px;line-height:1.7;user-select:none;background:var(--bg);
    min-width:45px;overflow:hidden;
  }
  .gutter span {
    display:block;padding:0 8px 0 4px;height:25.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .gutter span.neg{color:var(--neg);}
  
  #noteBody{
    flex:1;background:var(--bg);border:none;color:var(--ink);
    font-family:var(--font);font-size:15px;line-height:1.7;
    padding:16px 16px 40vh;resize:none;outline:none;
    white-space:pre;overflow-wrap:normal;overflow-x:auto;
  }
  #noteBody::placeholder{color:var(--muted);}

  .icon-btn svg{width:22px;height:22px;}
  .icon-btn.wa-ico{color:var(--wa);}
  
  .mode-btn{
    background:var(--total-bg);border:1px solid var(--line);
    color:var(--ink);font-size:12px;font-weight:700;
    padding:6px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;
  }
  .mode-btn.texto{color:var(--muted);}
  
  #editView.text-mode .total-bar,
  #editView.text-mode .resumo-wrap,
  #editView.text-mode .gutter{display:none !important;}

  .resumo-wrap{flex-shrink:0;}
  .resumo-wrap.empty{display:none;}
  .resumo-header{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border:none;border-top:1px solid var(--line);
    color:var(--muted);padding:10px 20px;cursor:pointer;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    font-family:var(--font);
  }
  .resumo-header:active{background:var(--total-bg);}
  .rh-chevron{font-size:14px;transition:transform .2s;}
  .resumo-wrap.collapsed .rh-chevron{transform:rotate(-90deg);}
  
  .resumo{
    flex-shrink:0;background:var(--panel);
    max-height:25vh;overflow-y:auto;padding:0 20px 12px;
  }
  .resumo-wrap.collapsed .resumo{display:none;}
  .resumo .row{display:flex;align-items:baseline;gap:10px;font-size:14.5px;padding:4px 0;}
  .resumo .row .nm{flex:1;min-width:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .resumo .row .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);}
  .resumo .row .qt{color:var(--num);font-weight:700;white-space:nowrap;}
  .resumo .row .qt.neg{color:var(--neg);}

  .total-bar{
    flex-shrink:0;background:var(--total-bg);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
  }
  .total-bar .lbl{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
  .total-bar .val{font-size:26px;font-weight:800;color:var(--accent);}
  .total-bar .val.neg{color:var(--neg);}

  /* Modal de Confirmação */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-content {
    background: var(--panel); width: 100%; max-width: 400px;
    border-radius: 16px; padding: 24px; border: 1px solid var(--line);
    text-align: center;
  }
  .modal-title { font-size: 18px; font-weight: 600; margin: 0 0 20px 0; }
  .modal-actions { display: flex; gap: 12px; justify-content: center; }
  .btn {
    flex: 1; background: var(--line); border: none; color: var(--ink);
    padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px;
  }
  .btn.danger-btn { background: var(--danger); color: #000; }
</style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <button class="back" id="backBtn" onclick="showList()">←</button>
    <div class="brand" id="brandText">SOMAR NOTAS</div>
    <h1 id="headerTitle">Nova Nota</h1>
    
    <button class="icon-btn hidden" id="modeBtn" onclick="toggleMode()">
      <span id="modeLabel" class="mode-btn">SOMA</span>
    </button>
    <button class="icon-btn wa-ico hidden" id="shareBtn" onclick="shareWhatsApp()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.717-1.456L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.428 2.02 13.963.992 11.34.992c-5.437 0-9.863 4.371-9.867 9.801-.001 1.73.457 3.42 1.32 4.933l-.994 3.629 3.722-.968c1.52.83 3.205 1.267 4.851 1.267zM17.51 14.93c-.323-.16-1.914-.933-2.203-1.037-.29-.105-.502-.158-.713.158-.21.317-.817.158-1.001.37-.183.21-.367.237-.69.078-.323-.16-1.364-.496-2.6-1.586-.96-.845-1.608-1.89-1.796-2.207-.189-.316-.02-.487.14-.646.145-.143.323-.37.484-.553.161-.184.215-.316.323-.527.108-.21.054-.395-.027-.553-.08-.16-.713-1.69-.977-2.31-.257-.604-.517-.523-.713-.533-.185-.01-.397-.01-.61-.01-.212 0-.555.079-.846.395-.29.316-1.11 1.066-1.11 2.6 0 1.533 1.11 3.013 1.261 3.217.152.204 2.186 3.298 5.297 4.613.739.313 1.317.5 1.768.64.743.234 1.419.201 1.953.12.595-.089 1.915-.77 2.185-1.476.269-.704.269-1.304.188-1.432-.081-.127-.297-.205-.62-.364z"/></svg>
    </button>
    <button class="icon-btn" id="deleteBtn" style="color:var(--danger); display:none;" onclick="deleteCurrentNote()">🗑️</button>
  </header>

  <!-- LIST VIEW -->
  <div id="listView" class="view">
    <div id="notesContainer"></div>
    <button class="fab" onclick="createNewNote()">+</button>
  </div>

  <!-- EDIT VIEW -->
  <div id="editView" class="view hidden">
    <input type="text" id="noteTitle" placeholder="Título da Nota..." oninput="saveCurrentData()">
    
    <div class="editor-wrap">
      <div class="gutter" id="gutterZone"></div>
      <textarea id="noteBody" placeholder="Digite os valores (um por linha)&#10;Exemplo:&#10;150 Mercado&#10;50 Combustível&#10;-20 Desconto" oninput="processNote()"></textarea>
    </div>

    <!-- Resumo Agrupado -->
    <div class="resumo-wrap collapsed" id="resumoSection">
      <button class="resumo-header" onclick="toggleResumo()">
        <span>Resumo de Itens</span>
        <span class="rh-chevron">▼</span>
      </button>
      <div class="resumo" id="resumoZone"></div>
    </div>

    <!-- Barra de Total -->
    <div class="total-bar">
      <div class="lbl">TOTAL</div>
      <div class="val" id="totalValue">R$ 0,00</div>
    </div>
  </div>
