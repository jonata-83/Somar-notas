<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c2321">
<title>Somar Notas</title>
<style>
  :root{--bg:#1c2321;--panel:#232b28;--line:#33403b;--ink:#e8e4d8;--muted:#8a938e;--num:#a3d977;--accent:#e0a458;--total-bg:#2a3430;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
  header h1{font-size:17px;font-weight:600;margin:0;flex:1;}
  .version-tag{font-size:10px;color:var(--accent);background:var(--total-bg);padding:2px 6px;border-radius:6px;font-weight:700;}
  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .hidden{display:none !important;}
  #listView{padding:8px 0 90px;}
  .note-card{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;border-left:4px solid transparent;}
  .note-card:active{background:var(--panel);}
  .note-card .info{flex:1;min-width:0;}
  .note-card .title{font-size:16px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .note-card .sub{font-size:13px;color:var(--muted);}
  .note-card .tot{font-size:18px;font-weight:700;color:var(--num);white-space:nowrap;}
  .empty{text-align:center;color:var(--muted);padding:70px 30px;}
  .fab-wrap{position:fixed;right:18px;bottom:22px;z-index:9999;}
  .fab{width:58px;height:58px;border-radius:18px;background:var(--accent);color:#1c2321;border:none;font-size:30px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;pointer-events:auto;-webkit-user-select:none;user-select:none;}
  .fab:active{transform:scale(.94);}
  #editView{display:flex;flex-direction:column;}
  #noteTitle{background:var(--panel);border:none;border-bottom:1px solid var(--line);color:var(--ink);font-size:18px;font-weight:600;padding:14px 18px;width:100%;outline:none;flex-shrink:0;}
  .editor-wrap{flex:1;display:flex;overflow:hidden;}
  .gutter{flex-shrink:0;padding:16px 0;text-align:right;color:var(--muted);font-size:15px;line-height:1.7;user-select:none;background:var(--bg);min-width:34px;}
  .gutter span{display:block;padding:0 8px 0 12px;}
  #noteBody{flex:1;background:var(--bg);border:none;color:var(--ink);font-size:15px;line-height:1.7;padding:16px 16px 40vh;resize:none;outline:none;white-space:pre;}
  .total-bar{flex-shrink:0;background:var(--total-bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  .total-bar .val{font-size:26px;font-weight:700;color:var(--num);}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;}
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>Somar Notas</h1>
  <span class="version-tag">v2.0.4</span>
</header>

<div class="view" id="listView">
  <div id="notesContainer"></div>
  <div class="empty hidden" id="emptyState">
    <div class="big">📝</div>
    <p>Nenhuma nota ainda.</p>
  </div>
</div>

<!-- FAB com múltiplos eventos de segurança -->
<div class="fab-wrap">
  <button class="fab" id="newBtn" aria-label="Nova nota"
    onclick="window.appNewNote()"
    ontouchstart="window.appNewNote(); event.preventDefault();"
  >+</button>
</div>

<div class="view hidden" id="editView">
  <input type="text" id="noteTitle" placeholder="Título">
  <div class="editor-wrap">
    <div class="gutter mono" id="gutter"><span>1</span></div>
    <textarea id="noteBody" class="mono" placeholder=""></textarea>
  </div>
  <div class="total-bar">
    <span class="lbl">Total</span>
    <span class="val mono" id="totalVal">0</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'somar_notas_v1';
let notes = [];
let currentId = null;

function load() {
  try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { notes = []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
}

function fmt(n) {
  if (Number.isInteger(n)) return n.toLocaleString('pt-BR');
  return n.toLocaleString('pt-BR', {maximumFractionDigits: 3});
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"]/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function dateStr(ts) {
  return new Date(ts).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
}

function lineValue(line) {
  if (/^\s*=\s*[\d.,]+\s*$/.test(line)) return 0;
  if (/^\s*TOTAL\s*=\s*[\d.,]+\s*$/i.test(line)) return 0;
  if (/x\s*\d/i.test(line)) return 0;
  var m = line.match(/^\s*([+-]?\d+(?:[.,]\d+)?)/);
  return m ? (parseFloat(m[1].replace(',', '.')) || 0) : 0;
}
function sumBody(body) {
  return (body || '').split(/
?
/).reduce(function(a, l) { return a + lineValue(l); }, 0);
}

function renderList() {
  var container = document.getElementById('notesContainer');
  var empty = document.getElementById('emptyState');
  if (!container || !empty) return;
  container.innerHTML = '';
  empty.classList.toggle('hidden', notes.length !== 0);
  var sorted = [...notes].sort(function(a, b) { return b.updated - a.updated; });
  sorted.forEach(function(n) {
    var tot = sumBody(n.body);
    var lines = (n.body || '').split(/
?
/).filter(function(l) { return l.trim(); }).length;
    var card = document.createElement('div');
    card.className = 'note-card';
    card.innerHTML = '<div class="info"><div class="title">' + escapeHtml(n.title || 'Sem título') + '</div><div class="sub">' + lines + ' ' + (lines === 1 ? 'linha' : 'linhas') + ' · ' + dateStr(n.updated) + '</div></div><div class="tot mono">' + fmt(tot) + '</div>';
    card.onclick = function() { openNote(n.id); };
    container.appendChild(card);
  });
}

function showEditor(show) {
  var listView = document.getElementById('listView');
  var editView = document.getElementById('editView');
  var newBtn = document.getElementById('newBtn');
  if (listView) listView.classList.toggle('hidden', show);
  if (editView) editView.classList.toggle('hidden', !show);
  if (newBtn) newBtn.classList.toggle('hidden', show);
}

function newNote() {
  alert('DEBUG: newNote() foi chamada!');
  try {
    currentId = 'n' + Date.now();
    notes.push({id: currentId, title: '', body: '', mode: 'somar', updated: Date.now()});
    var noteTitle = document.getElementById('noteTitle');
    var noteBody = document.getElementById('noteBody');
    if (noteTitle) noteTitle.value = '';
    if (noteBody) noteBody.value = '';
    showEditor(true);
    refreshEditor();
    if (noteTitle) setTimeout(function() { noteTitle.focus(); }, 100);
  } catch (e) {
    alert('ERRO em newNote: ' + e.message);
  }
}
window.appNewNote = newNote;

function openNote(id) {
  try {
    var n = notes.find(function(x) { return x.id === id; });
    if (!n) return;
    currentId = id;
    var noteTitle = document.getElementById('noteTitle');
    var noteBody = document.getElementById('noteBody');
    if (noteTitle) noteTitle.value = n.title || '';
    if (noteBody) noteBody.value = n.body || '';
    showEditor(true);
    refreshEditor();
  } catch (e) {
    alert('ERRO openNote: ' + e.message);
  }
}

function closeEditor() {
  try {
    persistCurrent(true);
    currentId = null;
    showEditor(false);
    renderList();
  } catch (e) {
    alert('ERRO close: ' + e.message);
  }
}

function persistCurrent(cleanupEmpty) {
  try {
    var n = notes.find(function(x) { return x.id === currentId; });
    if (!n) return;
    var noteTitle = document.getElementById('noteTitle');
    var noteBody = document.getElementById('noteBody');
    n.title = noteTitle ? noteTitle.value.trim() : '';
    n.body = noteBody ? noteBody.value : '';
    n.updated = Date.now();
    if (cleanupEmpty && !n.title && !(n.body || '').trim()) {
      notes = notes.filter(function(x) { return x.id !== currentId; });
    }
    save();
  } catch (e) {}
}

function refreshEditor() {
  try {
    var noteBody = document.getElementById('noteBody');
    var gutter = document.getElementById('gutter');
    var totalVal = document.getElementById('totalVal');
    if (!noteBody || !gutter || !totalVal) return;
    var lines = noteBody.value.split(/
?
/);
    var nLines = Math.max(lines.length, 1);
    var g = '';
    for (var i = 1; i <= nLines; i++) {
      var neg = lines[i - 1] && /^\s*-\d/.test(lines[i - 1]);
      g += '<span class="' + (neg ? 'neg' : '') + '">' + i + '</span>';
    }
    gutter.innerHTML = g;
    var tot = sumBody(noteBody.value);
    totalVal.textContent = fmt(tot);
    totalVal.classList.toggle('neg', tot < 0);
  } catch (e) {}
}

function setupEvents() {
  try {
    var newBtn = document.getElementById('newBtn');
    var backBtn = document.getElementById('backBtn');
    var noteTitle = document.getElementById('noteTitle');
    var noteBody = document.getElementById('noteBody');

    alert('DEBUG: setupEvents iniciado. newBtn=' + (newBtn ? 'ENCONTRADO' : 'NULO'));

    if (newBtn) {
      newBtn.onclick = newNote;
      newBtn.addEventListener('touchend', function(e) {
        e.preventDefault();
        newNote();
      }, {passive: false});
    }
    if (backBtn) backBtn.onclick = closeEditor;
    if (noteTitle) noteTitle.addEventListener('input', function() { persistCurrent(false); });
    if (noteBody) {
      noteBody.addEventListener('input', function() { refreshEditor(); persistCurrent(false); });
    }
  } catch (e) {
    alert('ERRO setupEvents: ' + e.message);
  }
}

let toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function init() {
  try {
    load();
    setupEvents();
    renderList();
    toast('App v2.0.4 carregado');
  } catch (e) {
    alert('ERRO INIT: ' + e.message);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
